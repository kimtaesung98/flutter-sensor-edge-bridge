name: sensor_bridge
description: Autonomous Sensor Bridge — Wear OS to Edge relay with secure admin UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Background service — foreground service Isolate
  flutter_background_service: ^5.0.5

  # Service locator / DI
  get_it: ^7.6.7

  # Local SQLite buffer
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Settings persistence
  shared_preferences: ^2.3.2

  # HTTP transport to edge server
  http: ^1.2.2

  # UUID — available if needed for production packet IDs
  uuid: ^4.5.1

  # Network connectivity detection (WiFi / mobile / ethernet)
  connectivity_plus: ^6.0.3

  # WiFi SSID and IP address lookup
  network_info_plus: ^5.0.3

  # Bluetooth LE scanning and GATT communication
  flutter_blue_plus: ^1.31.15

  # Android runtime permission requests
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
